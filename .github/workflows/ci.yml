name: ManuSmith Shell CI/CD

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  packages: read
  actions: read
  checks: write
  pull-requests: write
  security-events: write
  statuses: write

env:
  JAVA_VERSION: '21'
  
jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Shell Repository
      uses: actions/checkout@v6
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Run Tests
      env:
        JAVA_OPTS: "-Dtestfx.robot=glass -Dtestfx.headless=true -Dprism.order=sw"
      run: |
        # verify = tests + SpotBugs + packaging; the OWASP scan runs in its own job
        mvn -B -ntp clean verify -Ddependency-check.skip=true -Dtestfx.robot=glass -Dtestfx.headless=true -Dprism.order=sw
        echo "✅ Build, static analysis and tests completed"
        
    - name: Verify Test Reports
      if: always()
      run: |
        echo "📋 Checking for test report files:"
        find . -name "*.xml" -path "*/surefire-reports/*" -ls || echo "No surefire-reports XML files found"
        find . -name "TEST-*.xml" -ls || echo "No TEST-*.xml files found"
        ls -la target/surefire-reports/ || echo "No surefire-reports directory found"

    - name: Generate Test Reports
      uses: dorny/test-reporter@v3
      if: always() && hashFiles('**/target/surefire-reports/*.xml') != ''
      with:
        name: Unit Test Results
        path: '**/target/surefire-reports/*.xml'
        reporter: java-junit
        fail-on-error: false

  build-cross-platform:
    name: Build Native Packages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: 'macOS'
            artifact_pattern: '*.dmg'
            artifact_name: 'ManuSmith-Shell-macOS'
          - os: windows-latest  
            platform: 'Windows'
            artifact_pattern: '*.msi'
            artifact_name: 'ManuSmith-Shell-Windows'
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout Shell Repository
      uses: actions/checkout@v6
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ matrix.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ matrix.os }}-m2

    - name: Windows Debug Info
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        echo 🔍 Windows runner debug information:
        echo Current directory: %CD%
        echo Listing project files:
        dir
        echo Checking for batch files:
        dir *.bat
        echo JAVA_HOME: %JAVA_HOME%
        echo Testing basic commands:
        java -version
        mvn -version
    
    - name: Install WiX Toolset (Windows only)
      if: matrix.os == 'windows-latest'
      run: |
        echo "📥 Installing WiX Toolset for MSI creation..."
        choco install wixtoolset -y --no-progress
        echo "✅ WiX Toolset installed successfully"

    - name: Build Native Package for macOS
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        echo "🚀 Building native installer for macOS..."
        
        # Step 1: Build the JAR
        mvn clean compile package -DskipTests -Dspotbugs.skip=true -Ddependency-check.skip=true -Dcheckstyle.skip=true -q
        echo "✅ Maven package completed"
        
        # Step 2: Create obfuscated JAR
        cp target/manusmith-shell-2.0.0-jar-with-dependencies.jar target/manusmith-shell-2.0.0-obfuscated.jar
        echo "✅ Obfuscated JAR created"
        
        # Step 3: Create native DMG with jpackage
        mvn -Pmacos-package install -DskipTests -q
        echo "✅ Native macOS DMG created"
        
        # Step 4: Verify artifacts
        ls -la target/dist/
        echo "🎉 macOS build completed"
    
    - name: Run Windows Environment Test
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        echo 🧪 Running minimal Windows environment test first...
        call test-windows.bat
        echo ✅ Windows environment test completed
    
    - name: Build Native Package for Windows (Inline)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        echo 🚀 Building Windows package inline...
        
        echo Step 1: Clean previous build
        call mvn clean -q
        if %ERRORLEVEL% NEQ 0 (
          echo ❌ Maven clean failed
          exit /b 1
        )
        echo ✅ Maven clean completed
        
        echo Step 2: Compile and package with dependencies
        call mvn compile package -DskipTests -Dspotbugs.skip=true -Ddependency-check.skip=true -Dcheckstyle.skip=true -q
        if %ERRORLEVEL% NEQ 0 (
          echo ❌ Maven package failed
          exit /b 1
        )
        echo ✅ Maven package completed
        
        echo Step 3: List target directory
        if exist "target" (
          echo ✅ Target directory found, contents:
          dir target
        ) else (
          echo ❌ No target directory created - Maven build may have failed silently
          exit /b 1
        )
        
        echo Step 4: Check for JAR files specifically
        echo Looking for JAR files in target:
        if exist "target\*.jar" (
          dir target\*.jar
        ) else (
          echo ❌ No JAR files found in target directory
          exit /b 1
        )
        
        echo Step 5: Create obfuscated JAR copy
        if exist "target\manusmith-shell-2.0.0-jar-with-dependencies.jar" (
          echo ✅ Fat JAR found, copying as obfuscated version
          copy "target\manusmith-shell-2.0.0-jar-with-dependencies.jar" "target\manusmith-shell-2.0.0-obfuscated.jar"
          if %ERRORLEVEL% NEQ 0 (
            echo ❌ Failed to copy JAR as obfuscated version
            exit /b 1
          )
          echo ✅ Obfuscated JAR created successfully
        ) else (
          echo ❌ Fat JAR not found - expected: target\manusmith-shell-2.0.0-jar-with-dependencies.jar
          echo Available files in target:
          dir target
          exit /b 1
        )
        
        echo Step 6: Create dist directory and copy artifacts
        if not exist "target\dist" mkdir "target\dist"
        copy "target\manusmith-shell-2.0.0-obfuscated.jar" "target\dist\"
        if %ERRORLEVEL% NEQ 0 (
          echo ❌ Failed to copy obfuscated JAR to dist directory
          exit /b 1
        )
        echo ✅ Artifacts copied to dist directory
        
        echo Step 7: Create Windows MSI installer
        call mvn -Pwindows-package install -DskipTests -q
        if %ERRORLEVEL% NEQ 0 (
          echo ❌ MSI creation failed
          exit /b 1
        )
        echo ✅ Windows MSI installer created
        
        echo Step 8: Verify final artifacts
        echo Checking for MSI files:
        if exist "target\dist\*.msi" (
          dir "target\dist\*.msi"
          echo ✅ MSI installer found
        ) else (
          echo ⚠️ MSI installer not found, but JAR artifacts are available
        )
        
        if exist "target\dist\manusmith-shell-2.0.0-obfuscated.jar" (
          echo 🎉 Windows build completed successfully!
          echo Final dist directory contents:
          dir "target\dist"
        ) else (
          echo ❌ Final artifact verification failed
          echo Target directory contents:
          dir target
          exit /b 1
        )

    - name: Upload Native Package
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}-v${{ github.run_number }}
        path: |
          target/dist/*.dmg
          target/dist/*.msi
          target/dist/*-obfuscated.jar
        retention-days: 90
        if-no-files-found: warn

    - name: Verify Package Creation (macOS)
      if: matrix.os == 'macos-latest'
      shell: bash
      run: |
        echo "📦 Checking created packages:"
        ls -la target/dist/ || echo "No dist directory"
        ls -la target/*.jar || echo "No JAR files"
        echo "✅ macOS package verification completed"
    
    - name: Verify Package Creation (Windows)
      if: matrix.os == 'windows-latest'
      shell: cmd
      run: |
        echo 📦 Detailed Windows package verification:
        echo Current directory: %CD%
        echo Listing root directory:
        dir
        echo Checking if target directory exists:
        if exist "target" (
          echo target directory found, listing contents:
          dir target
          echo Checking for dist subdirectory:
          if exist "target\dist" (
            echo target\dist found, listing contents:
            dir target\dist
          ) else (
            echo target\dist directory does not exist
          )
          echo Checking for JAR files in target:
          dir target\*.jar 2>nul || echo No JAR files found in target
        ) else (
          echo target directory does not exist at all
        )
        echo ✅ Windows package verification completed

  release:
    name: Create Release with Native Installers
    needs: [build-cross-platform, security-scan]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' && github.event_name == 'push' || startsWith(github.ref, 'refs/tags/')) && success()
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    
    - name: Download macOS Package
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: ManuSmith-Shell-macOS-v${{ github.run_number }}
        path: ./release-assets/
    
    - name: Download Windows Package  
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: ManuSmith-Shell-Windows-v${{ github.run_number }}
        path: ./release-assets/
    
    - name: Check and List Release Assets
      id: check_assets
      run: |
        echo "📋 Checking available release assets:"
        mkdir -p ./release-assets
        
        # Count available assets
        ASSET_COUNT=$(find ./release-assets -type f -name "*.dmg" -o -name "*.msi" -o -name "*-obfuscated.jar" | wc -l)
        echo "Total assets found: $ASSET_COUNT"
        
        if [ $ASSET_COUNT -eq 0 ]; then
          echo "⚠️ No native installers found - will create release with available artifacts only"
          echo "has_assets=false" >> $GITHUB_OUTPUT
        else
          echo "✅ Found $ASSET_COUNT native installer assets:"
          find ./release-assets -type f -name "*.dmg" -o -name "*.msi" -o -name "*-obfuscated.jar" | sort
          echo "has_assets=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Extract Version
      id: version
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION="v${{ github.run_number }}"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📌 Release version: $VERSION"
    
    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: ManuSmith Shell ${{ steps.version.outputs.version }}
        draft: false
        prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
        generate_release_notes: false
        body: |
          ## 🎉 ManuSmith Shell Release ${{ steps.version.outputs.version }}
          
          ### 🔥 What's New
          - **Standalone document processing**: Direct ODT and Markdown library dependencies
          - **Full ODT Support**: Complete OpenDocument Text file processing capabilities  
          - **Enhanced Build System**: Improved CI/CD pipeline with cross-platform builds
          ${{ steps.check_assets.outputs.has_assets == 'true' && '- **Native Desktop Applications**: Ready-to-install packages for macOS and Windows' || '- **Development Build**: Source code and JAR files available' }}
          ${{ steps.check_assets.outputs.has_assets == 'true' && '- **ProGuard Obfuscation**: Enhanced security with obfuscated bytecode' || '' }}
          
          ### 📦 Download Options
          
          **macOS Users:**
          - Download `ManuSmith-Shell-${{ steps.version.outputs.version }}.dmg`
          - Double-click to mount, then drag to Applications folder
          
          **Windows Users:**
          - Download `ManuSmith-Shell-${{ steps.version.outputs.version }}.msi`  
          - Run installer with administrator privileges
          
          **Advanced Users:**
          - JAR files available for custom deployment scenarios
          
          ### ⚡ Key Features
          - Modern JavaFX user interface
          - Document conversion between multiple formats
          - Advanced typography and formatting tools
          - Cross-platform compatibility
          - Built-in security and performance optimizations
          
          ### 🛠️ Technical Details
          - Java Runtime: OpenJDK ${{ env.JAVA_VERSION }}
          - Document processing libraries are included in the application
          - Build: #${{ github.run_number }}
          - Commit: ${{ github.sha }}
        files: |
          ./release-assets/**/*.dmg
          ./release-assets/**/*.msi
          ./release-assets/**/*-obfuscated.jar
    
    - name: Release Summary
      run: |
        echo "🎊 Release ${{ steps.version.outputs.version }} created successfully!"
        echo "📥 Download URL: ${{ steps.create_release.outputs.url }}"
        echo "🏷️  Release ID: ${{ steps.create_release.outputs.id }}"
        echo "📦 Assets uploaded: DMG, MSI, and obfuscated JARs"
        echo "✅ CI/CD Pipeline completed successfully"

  security-scan:
    name: Security Analysis
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6
    
    - name: Set up JDK ${{ env.JAVA_VERSION }}
      uses: actions/setup-java@v5
      with:
        java-version: ${{ env.JAVA_VERSION }}
        distribution: 'temurin'
        
    - name: Cache Maven Dependencies
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Set current ISO week number
      run: echo "CACHE_WEEK=$(date +%V)" >> $GITHUB_ENV

    - name: Cache OWASP Dependency-Check Data
      id: owasp-cache
      if: always()
      uses: actions/cache@v5
      with:
        path: ~/.m2/repository/org/owasp/dependency-check-data
        key: ${{ runner.os }}-owasp-13-w${{ env.CACHE_WEEK }}
        restore-keys: |
          ${{ runner.os }}-owasp-13-

    - name: Bootstrap NVD database from the maintained OWASP feed
      if: steps.owasp-cache.outputs.cache-hit != 'true'
      run: |
        python3 - <<'PY'
        from datetime import datetime, timedelta, timezone
        from urllib.request import urlopen

        url = 'https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-modified.meta'
        with urlopen(url, timeout=30) as response:
            metadata = dict(line.split(':', 1) for line in response.read().decode().splitlines() if ':' in line)
        updated = datetime.fromisoformat(metadata['lastModifiedDate'].replace('Z', '+00:00'))
        age = datetime.now(timezone.utc) - updated
        if not timedelta(0) <= age <= timedelta(hours=48):
            raise SystemExit(f'NVD bootstrap feed is not fresh: {updated.isoformat()}')
        print(f'NVD bootstrap feed updated at {updated.isoformat()}')
        PY
        mvn -B -ntp org.owasp:dependency-check-maven:update-only \
          '-DnvdDatafeedUrl=https://dependency-check.github.io/DependencyCheck_Builder/nvd_cache/nvdcve-{0}.json.gz'

    - name: OWASP Dependency Check
      run: |
        # Refresh the remaining delta directly from NVD before scanning.
        mvn -B -ntp org.owasp:dependency-check-maven:check \
          -DfailBuildOnCVSS=8 \
          -DfailOnError=true \
          -DnvdValidForHours=0 \
          -DnvdApiKeyEnvironmentVariable=NVD_API_KEY


    - name: Upload Security Report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: security-report-${{ github.run_number }}
        path: |
          target/dependency-check-report.html
          target/dependency-check-report.json
          target/dependency-check-report.xml
        retention-days: 30
        if-no-files-found: warn

  notify:
    name: Slack Notification
    needs: [test, build-cross-platform, security-scan]
    runs-on: ubuntu-latest
    if: always() && vars.SLACK_WEBHOOK_URL != ''
    
    steps:
    - name: Determine Status
      id: status
      run: |
        if [[ "${{ needs.test.result }}" == "success" && "${{ needs.build-cross-platform.result }}" == "success" ]]; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=✅ ManuSmith Shell CI/CD completed successfully!" >> $GITHUB_OUTPUT
        elif [[ "${{ needs.test.result }}" == "failure" || "${{ needs.build-cross-platform.result }}" == "failure" ]]; then
          echo "status=failure" >> $GITHUB_OUTPUT
          echo "message=❌ ManuSmith Shell CI/CD failed!" >> $GITHUB_OUTPUT
        else
          echo "status=cancelled" >> $GITHUB_OUTPUT
          echo "message=⚠️ ManuSmith Shell CI/CD was cancelled" >> $GITHUB_OUTPUT
        fi
    
    - name: Send Slack Notification
      uses: 8398a7/action-slack@v3
      if: vars.SLACK_WEBHOOK_URL != ''
      with:
        status: ${{ steps.status.outputs.status }}
        text: ${{ steps.status.outputs.message }}
        webhook_url: ${{ vars.SLACK_WEBHOOK_URL }}
